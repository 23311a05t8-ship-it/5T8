<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Sample Shopping Cart</h1>
  </header>

  <main>
    <section id="product-list">
      <h2>Products</h2>

      <div class="product">
        <img src="images/5 star.webp" width="150" height="150">
        <span>Product 1</span>
        <button onclick="addToCart('Product 1', 70)">Add to Cart (Rs.70)</button>
      </div>

      <div class="product">
        <img src="images/dairymilk.jpg" width="150" height="150">
        <span>Product 2</span>
        <button onclick="addToCart('Product 2', 45)">Add to Cart (Rs.45)</button>
      </div>

      <div class="product">
        <img src="images/kitkat.webp" width="150" height="150">
        <span>Product 3</span>
        <button onclick="addToCart('Product 3', 40)">Add to Cart (Rs.40)</button>
      </div>
    </section>

    <section id="cart">
      <h2>Your Cart</h2>
      <ul id="cartItems"></ul>
      <p id="totalPrice">Total Price: Rs.0</p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Shopping Cart Example</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
